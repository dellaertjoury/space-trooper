# Every push to master: build the game and publish it to GitHub Pages. About a minute.
# The test agents do NOT run here. Start them by hand: Actions -> "Run test agents".
name: Deploy

on:
  push:
    branches: [master]
    paths-ignore: # changes that don't affect the game skip the deploy
      - '**.md'
      - 'agents/**'
      - 'tools/**'
      - '.github/workflows/agents.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
